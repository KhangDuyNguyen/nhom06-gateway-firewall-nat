# =====================================================================
#  NHOM 06 - Cau hinh Gateway Firewall NAT/PAT
#  Mo hinh mang mo phong tren mot may (dung dai loopback 127.0.0.x):
#
#     Client LAN            GATEWAY                 Internet
#   127.0.0.11 ---> 127.0.0.1:8080 | 127.0.0.2:4xxxx ---> 127.0.0.3:9000
#   127.0.0.12 --/   (LAN side)      (WAN side)
# =====================================================================

# --- Giao dien phia LAN (noi bo) ---
gateway.lan.ip=127.0.0.1
gateway.lan.tcp.port=8080
gateway.lan.udp.port=8081

# --- Giao dien phia WAN (IP cong cong duy nhat cua Gateway) ---
# Neu he dieu hanh khong cho bind 127.0.0.2, Gateway tu dong lui ve gateway.lan.ip
gateway.public.ip=127.0.0.2

# --- Dai cong cong khai cap phat cho PAT ---
# Dai nho (vi du 40000-40009) de de minh hoa tinh huong "het cong NAT"
nat.port.min=40000
nat.port.max=40099

# --- NAT session timeout (don vi: mili giay) ---
nat.tcp.timeout.ms=60000
nat.udp.timeout.ms=30000
nat.cleanup.interval.ms=5000

# In tu dong bang NAT sau moi X ms (0 = tat, dung lenh 'nat' de xem thu cong)
nat.autodisplay.ms=0

# --- Firewall ---
firewall.rules.file=config/firewall-rules.txt

# --- Phat hien quet cong ---
# Bi tu choi >= threshold cong khac nhau trong window.ms -> phat canh bao
security.scan.threshold=3
security.scan.window.ms=10000

# Cac cong cong khai duoc mo chi de GIAM SAT (khong co dich vu that phia sau)
monitor.ports=8023,8445,8139

# --- Port Forwarding (NAT tinh): <congCongKhai>><ipNoiBo>:<congNoiBo> ---
portforward.1=8090>127.0.0.20:7000

# --- Khac ---
relay.buffer.size=8192
connect.timeout.ms=5000
header.timeout.ms=10000
log.file=logs/gateway.log
log.verbose=true
